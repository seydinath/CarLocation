<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Test Pannellum - Visite immersive</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/pannellum@2.5.6/build/pannellum.css"
    />
    <style>
      html, body { height: 100%; margin: 0; font-family: sans-serif; }
      .container { width: 90%; max-width: 1000px; margin: 40px auto; height: 600px; position: relative; }
      #panorama { width: 100%; height: 100%; border-radius: 8px; overflow: hidden; box-shadow: 0 8px 24px rgba(0,0,0,0.15); }
      .overlay-note { position: absolute; top: 12px; left: 12px; z-index: 10; background: rgba(0,0,0,0.45); color: #fff; padding: 6px 10px; border-radius: 4px; }
      @media (max-width: 600px) { .container { height: 50vh; margin: 16px; } }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="overlay-note">Test Pannellum — image : pannel.jpeg</div>
      <div id="panorama"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/pannellum@2.5.6/build/pannellum.js"></script>
    <script>
      // Démarrage du viewer Pannellum
      // Remarque : l'image doit être accessible depuis la racine du serveur via /pannel.jpeg
      const viewer = pannellum.viewer('panorama', {
        type: 'equirectangular',
        panorama: '/pannel.jpeg',
        autoLoad: true,
        showZoomCtrl: true,
        hfov: 100
      });
    </script>
  </body>
</html>

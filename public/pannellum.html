<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Test Pannellum - Visite immersive</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/pannellum@2.5.6/build/pannellum.css"
    />
    <style>
      html, body { height: 100%; margin: 0; font-family: sans-serif; }
      .container { width: 90%; max-width: 1000px; margin: 40px auto; height: 600px; position: relative; }
      #panorama { width: 100%; height: 100%; border-radius: 8px; overflow: hidden; box-shadow: 0 8px 24px rgba(0,0,0,0.15); }
      .overlay-note { position: absolute; top: 12px; left: 12px; z-index: 10; background: rgba(0,0,0,0.45); color: #fff; padding: 6px 10px; border-radius: 4px; }
      @media (max-width: 600px) { .container { height: 50vh; margin: 16px; } }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="overlay-note" id="status-note">Chargement de la visite interieure...</div>
      <div id="panorama"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/pannellum@2.5.6/build/pannellum.js"></script>
    <script>
      const localPanorama = '/pannel.jpeg';
      const fallbackPanorama = 'https://pannellum.org/images/alma.jpg';
      const statusNote = document.getElementById('status-note');

      function loadViewer(panoramaUrl) {
        pannellum.viewer('panorama', {
          type: 'equirectangular',
          panorama: panoramaUrl,
          autoLoad: true,
          showZoomCtrl: true,
          hfov: 100
        });
      }

      function testImage(url, onSuccess, onFailure) {
        const testImg = new Image();
        testImg.onload = onSuccess;
        testImg.onerror = onFailure;
        testImg.src = url;
      }

      // On essaie d'abord l'image locale. Si elle manque, on bascule sur une image de secours.
      testImage(
        localPanorama,
        () => {
          statusNote.textContent = 'Visite interieure active';
          loadViewer(localPanorama);
        },
        () => {
          testImage(
            fallbackPanorama,
            () => {
              statusNote.textContent = 'Visite interieure active (image de secours)';
              loadViewer(fallbackPanorama);
            },
            () => {
              statusNote.textContent = 'Impossible de charger la visite interieure';
            }
          );
        }
      );
    </script>
  </body>
</html>
